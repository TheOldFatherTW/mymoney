<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<script>
(function () {
  function stopZoom(ev) { ev.preventDefault(); }
  document.addEventListener("gesturestart", stopZoom, { passive: false });
  document.addEventListener("gesturechange", stopZoom, { passive: false });
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="MyMoney"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#fafafa"/>
<link rel="apple-touch-icon" href="./icons/mark-180.png?v=2"/>
<link rel="icon" type="image/png" href="./icons/mark-180.png?v=2"/>
<title>MyMoney</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./app.css?v=4"/>
<link rel="stylesheet" href="./money.css?v=6"/>
<script src="./config.js?v=1788858990"></script>
<script>
(function () {
  window.MYMONEY_NEED_GATE = true;
  window.MYMONEY_FORCE_INVITE = true;
  document.documentElement.classList.add("need-gate");
  var KEY_RE = /^[A-Za-z0-9_-]{8,128}$/;
  var q = new URLSearchParams(location.search).get("k") || "";
  var h = "";
  try {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw.indexOf("k=") === 0) {
      h = decodeURIComponent((raw.slice(2).split("&")[0] || "").replace(/\+/g, " "));
    } else {
      h = new URLSearchParams(raw).get("k") || "";
    }
  } catch (e) {}
  var fromUrl = KEY_RE.test(q) ? q : KEY_RE.test(h) ? h : "";
  window.MYMONEY_URL_KEY = fromUrl;
  window.MYMONEY_VIEW_KEY = "";
  var origin = window.VAULT_ORIGIN;
  if (origin) {
    var link = document.createElement("link");
    link.rel = "preconnect";
    link.href = origin;
    link.crossOrigin = "anonymous";
    document.head.appendChild(link);
  }
})();
</script>
</head>
<body>
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="hall with-feed is-invite" id="hall">
  <div class="profile">
    <div class="money-mark" id="money-mark"></div>
    <h1 class="brand">MyMoney</h1>
    <p class="status" id="status"></p>
    <div class="invite-panel" id="invite-panel">
      <p class="invite-hey" id="invite-hey">給老婆看的退休金</p>
      <p class="invite-safari" id="invite-safari" hidden>請用 Safari 打開</p>
      <div class="gate-dots" id="gate-dots" aria-hidden="true"></div>
      <div class="gate-pad" id="gate-pad" role="group" aria-label="數字門">
        <button type="button" class="gate-key" data-num="1">1</button>
        <button type="button" class="gate-key" data-num="2">2</button>
        <button type="button" class="gate-key" data-num="3">3</button>
        <button type="button" class="gate-key" data-num="4">4</button>
        <button type="button" class="gate-key" data-num="5">5</button>
        <button type="button" class="gate-key" data-num="6">6</button>
        <button type="button" class="gate-key" data-num="7">7</button>
        <button type="button" class="gate-key" data-num="8">8</button>
        <button type="button" class="gate-key" data-num="9">9</button>
        <span class="gate-skip" aria-hidden="true"></span>
        <button type="button" class="gate-key" data-num="0">0</button>
        <button type="button" class="gate-key gate-del" data-del="1" aria-label="刪除">⌫</button>
      </div>
    </div>
    <div class="invite-wait" id="invite-wait" hidden>
      <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="invite-wait-bar" id="invite-wait-bar"></div>
    </div>
  </div>
</div>
<script src="./mark.js?v=2"></script>
<script src="./gate.js?v=1"></script>
<script src="./hey.js?v=1"></script>
<script src="./door.js?v=10"></script>
</body>
</html>
