<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<script>
(function () {
  function stopZoom(ev) { ev.preventDefault(); }
  document.addEventListener("gesturestart", stopZoom, { passive: false });
  document.addEventListener("gesturechange", stopZoom, { passive: false });
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="MyMoney"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#fafafa"/>

<link rel="icon" type="image/png" href="./icons/mark-180.png?v=1"/>
<title>MyMoney</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./app.css?v=3"/>
<link rel="stylesheet" href="./money.css?v=5"/>
<script src="./config.js?v=1788858990"></script>
<script>
(function () {
  var opened = "";
  try { opened = sessionStorage.getItem("mymoney.gateOk") || ""; } catch (e) {}
  window.MYMONEY_NEED_GATE = opened !== "1";
  document.documentElement.classList.add(window.MYMONEY_NEED_GATE ? "need-gate" : "gate-ok");
  var KEY_RE = /^[A-Za-z0-9_-]{8,128}$/;
  var stored = "";
  try { stored = localStorage.getItem("mymoney.viewKey") || ""; } catch (e) {}
  var cookie = "";
  try {
    var m = document.cookie.match(/(?:^|; )mymoney\.viewKey=([^;]*)/);
    cookie = m ? decodeURIComponent(m[1]) : "";
  } catch (e) {}
  var q = new URLSearchParams(location.search).get("k") || "";
  var h = "";
  try {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw.indexOf("k=") === 0) {
      h = decodeURIComponent((raw.slice(2).split("&")[0] || "").replace(/\+/g, " "));
    } else {
      h = new URLSearchParams(raw).get("k") || "";
    }
  } catch (e) {}
  var fromUrl = KEY_RE.test(q) ? q : KEY_RE.test(h) ? h : "";
  var token = fromUrl || (KEY_RE.test(stored) ? stored : "") || (KEY_RE.test(cookie) ? cookie : "");
  window.MYMONEY_URL_KEY = fromUrl;
  window.MYMONEY_VIEW_KEY = token;
  if (token && !window.MYMONEY_NEED_GATE) {
    try { localStorage.setItem("mymoney.viewKey", token); } catch (e) {}
    if (typeof navigator.standalone === "boolean" && !navigator.standalone) {
      var pin = location.pathname + "?k=" + encodeURIComponent(token) + "#k=" + encodeURIComponent(token);
      if (location.pathname + location.search + location.hash !== pin) {
        history.replaceState({}, "", pin);
      }
    }
  }
  var origin = window.VAULT_ORIGIN;
  if (origin) {
    var link = document.createElement("link");
    link.rel = "preconnect";
    link.href = origin;
    link.crossOrigin = "anonymous";
    document.head.appendChild(link);
  }
})();
</script>
</head>
<body>
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="hall with-feed is-invite" id="hall">
  <div class="profile">
    <div class="money-mark" id="money-mark"></div>
    <h1 class="brand">MyMoney</h1>
    <p class="status" id="status"></p>
    <div class="invite-panel" id="invite-panel">
      <p class="invite-hey" id="invite-hey">給老婆看的退休金</p>
      <p class="invite-safari" id="invite-safari" hidden>請用 Safari 打開</p>
      <div class="gate-dots" id="gate-dots" aria-hidden="true"></div>
      <div class="gate-pad" id="gate-pad" role="group" aria-label="數字門">
        <button type="button" class="gate-key" data-num="1">1</button>
        <button type="button" class="gate-key" data-num="2">2</button>
        <button type="button" class="gate-key" data-num="3">3</button>
        <button type="button" class="gate-key" data-num="4">4</button>
        <button type="button" class="gate-key" data-num="5">5</button>
        <button type="button" class="gate-key" data-num="6">6</button>
        <button type="button" class="gate-key" data-num="7">7</button>
        <button type="button" class="gate-key" data-num="8">8</button>
        <button type="button" class="gate-key" data-num="9">9</button>
        <span class="gate-skip" aria-hidden="true"></span>
        <button type="button" class="gate-key" data-num="0">0</button>
        <button type="button" class="gate-key gate-del" data-del="1" aria-label="刪除">⌫</button>
      </div>
    </div>
    <div class="invite-wait" id="invite-wait" hidden>
      <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="invite-wait-bar" id="invite-wait-bar"></div>
    </div>
  </div>
  <div class="stage-bg" id="stage-bg" hidden></div>
  <div class="home-head" id="home-head" hidden>
    <div class="cab-hud" id="cab-hud" hidden>
      <div class="cab-wrap">
        <div class="cab-cover">
          <div class="cab-ring" aria-hidden="true"></div>
          <div class="cab-face"><img id="face-img" alt="" src="./face-default.jpg?v=1"/><span class="cab-foil" aria-hidden="true"></span></div>
          <div class="cab-mask" aria-hidden="true"></div>
        </div>
        <div id="album-settings" class="album-settings" hidden></div>
      </div>
      <p class="reader-name" id="reader-name"></p>
    </div>
    <div class="tag-board" id="tag-board" hidden>
      <button type="button" class="ins-icon nav-back" id="shelf-back" hidden aria-label="返回">
        <span class="ins-ring"></span>
        <span class="ins-face">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5M8.5 12H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <div class="mode-bar" id="mode-bar" hidden></div>
    </div>
  </div>
  <div class="feed news-list" id="feed"></div>
  <div class="content-page" id="content-page" hidden>
    <section class="money-overview" aria-labelledby="ovKicker">
      <p class="money-kicker" id="ovKicker">當前總金額</p>
      <p class="money-hero" id="ovTotal">—</p>
      <p class="money-withdraw" id="ovWithdraw">可提領</p>
      <div class="money-stats">
        <div>
          <span id="ovGainLabel">相對本金</span>
          <strong id="ovGain">—</strong>
        </div>
        <div>
          <span id="ovDayLabel">今日</span>
          <strong id="ovDay">—</strong>
        </div>
        <div>
          <span id="ovMarketLabel">市場</span>
          <strong id="ovMarket">—</strong>
        </div>
      </div>
    </section>
    <section class="money-compound" aria-labelledby="cpKicker">
      <p class="money-kicker" id="cpKicker">二十年後大約</p>
      <p class="money-hero is-soft" id="cpTotal">—</p>
      <p class="money-note" id="cpNote">年化7％複利估算</p>
    </section>
    <section class="money-holds" aria-labelledby="holdKicker">
      <p class="money-kicker" id="holdKicker">持倉</p>
      <div class="news-list" id="holdFeed"></div>
    </section>
    <section class="money-news" aria-labelledby="newsKicker">
      <p class="money-kicker" id="newsKicker">最近消息</p>
      <div class="news-list" id="newsList"></div>
    </section>
  </div>
</div>
<aside class="photo-rail" id="photo-rail" hidden aria-label="持股操作"></aside>
<input id="cover-input" type="file" accept="image/*" hidden/>
<input id="backdrop-input" type="file" accept="image/*" hidden/>
<input id="book-cover-input" type="file" accept="image/*" hidden/>
<div class="batch-tag-mask" id="actMask" hidden>
  <div class="batch-tag-sheet" id="actSheet">
    <div class="batch-tag-head">
      <p id="actTitle">工作佇列</p>
      <button type="button" class="batch-tag-close" id="actClose" aria-label="關閉">×</button>
    </div>
    <div id="actBody"></div>
  </div>
</div>
<div class="batch-tag-mask" id="waitMask" hidden>
  <div class="batch-tag-sheet is-wait" id="waitSheet">
    <div class="batch-tag-head">
      <p id="waitTitle">更換背景中</p>
    </div>
    <p class="wait-pct" id="waitPct">0%</p>
    <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</div>
<div class="ask-mask" id="askMask" hidden>
  <div class="ask-card" role="dialog" aria-modal="true">
    <p id="askText">是否取消最愛</p>
    <div class="ask-actions">
      <button type="button" class="ask-no" id="askNo">取消</button>
      <button type="button" class="ask-yes" id="askYes" hidden>丟掉</button>
      <button type="button" class="tag-apply" id="askOk"><span class="tag-apply-face">確認</span></button>
    </div>
  </div>
</div>
<div class="home-install" id="home-install" hidden>
  <p>請點底部分享，再選加入主畫面</p>
  <button type="button" class="invite-go" id="home-installed">我已加入</button>
</div>

<script src="./gate.js?v=1"></script>
<script src="./hey.js?v=1"></script>
<script src="./door.js?v=10"></script>
</body>
</html>
